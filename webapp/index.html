<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#FEE3A2">
    <title>Proactive Ed - Mini App</title>

    <!-- Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- Шапка -->
        <header class="header">
            <div class="header-text">
                <h1>Proactive Ed</h1>
                <p>Планування навчання та<br>відстеження прогресу</p>
                <p class="greeting" id="greeting" hidden></p>
            </div>
            <button class="theme-toggle" id="themeBtn" type="button"
                    aria-label="Перемкнути тему" aria-pressed="false">
                <!-- Луна: показана в светлой теме -->
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/>
                </svg>
                <!-- Солнце: показано в тёмной теме -->
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
                </svg>
            </button>
        </header>

        <!-- Контент с карточками -->
        <main class="content">
            <div class="grid">
                <a class="card" href="#plans" data-section="plans" data-title="Навчальні плани" data-status="soon">
                    <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/></svg></div>
                    <h2 class="card-title">Навчальні плани</h2>
                    <p class="card-subtitle">Створення планів і сесій</p>
                    <span class="card-badge">Скоро</span>
                </a>
                <a class="card" href="#tasks" data-section="tasks" data-title="Завдання" data-status="soon">
                    <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7L16 9.5"/></svg></div>
                    <h2 class="card-title">Завдання</h2>
                    <p class="card-subtitle">Статуси та нагадування</p>
                    <span class="card-badge">Скоро</span>
                </a>
                <a class="card full-width" href="#progress" data-section="progress" data-title="Прогрес" data-status="soon">
                    <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg></div>
                    <h2 class="card-title">Прогрес</h2>
                    <p class="card-subtitle">Статистика та навчальні цілі. Відстежуйте свої успіхи зручно.</p>
                    <span class="card-badge">Скоро</span>
                </a>
            </div>
        </main>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <!-- Фиксированная кнопка внизу -->
        <div class="sticky-footer">
            <button class="main-button" id="mainBtn" type="button">Перевірити зв'язок із Telegram</button>
        </div>

    </div>

    </body>
</html>
