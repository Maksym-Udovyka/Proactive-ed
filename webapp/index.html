<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Proactive Ed</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 32px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.45;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 26px; margin: 8px 0 4px; }
    .subtitle { color: var(--hint); margin: 0 0 20px; }
    #hello { font-size: 18px; margin: 0 0 20px; }
    .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
    .card h2 { font-size: 16px; margin: 0 0 4px; }
    .card p { margin: 0; color: var(--hint); font-size: 14px; }
    button {
      width: 100%;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Proactive Ed</h1>
    <p class="subtitle">Планування навчання та відстеження прогресу</p>
    <p id="hello">Завантаження...</p>

    <div class="card">
      <h2>Навчальні плани</h2>
      <p>Скоро: створення планів і навчальних сесій</p>
    </div>
    <div class="card">
      <h2>Завдання та дедлайни</h2>
      <p>Скоро: статуси завдань і нагадування</p>
    </div>
    <div class="card">
      <h2>Прогрес</h2>
      <p>Скоро: статистика та навчальні цілі</p>
    </div>

    <button id="btn" type="button">Перевірити зв'язок із Telegram</button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const hello = document.getElementById("hello");
    const btn = document.getElementById("btn");

    if (tg && tg.initData) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe.user;
      hello.textContent = user ? "Привіт, " + user.first_name + "!" : "Привіт!";
      btn.addEventListener("click", function () {
        tg.showAlert("Mini App працює. Платформа: " + tg.platform);
      });
    } else {
      hello.textContent = "Відкрийте цю сторінку з Telegram";
      btn.disabled = true;
    }
  </script>
</body>
</html>
